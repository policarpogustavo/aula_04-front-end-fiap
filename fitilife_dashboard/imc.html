<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
/>
    <title>Calculadora de IMC</title>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo" id="logo">
            <i class="fas fa-heartbeat"></i>Fitilife</a>

        <ul class="nav-links">
            <li><a class="nav-link" href="../index.html">Home</a></li>
            <li><a class="nav-link active" href="./imc.html">IMC</a></li>
            <li><a class="nav-link" href="./tmb.html">TMB</a></li>
            <li><a class="nav-link" href="./walter.html">Água</a></li>
        </ul>
    </nav>
    <main>
        <section class="form-container">
            <h2><i class="fas fa-weight"></i> Cálculo de IMC</h2>

            <form action="">
                <div class="form-group">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" placeholder="Ex: 70">
                </div>
                <div class="form-group">
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" placeholder="Ex: 1.75">
                </div>
                <button type="submit" class="btn btn-primary">Calcular</button>
            </form>

            <a href="../index.html" class="btn btn-secondary">Voltar</a>
        </section>
    </main>
</body>
</html>
